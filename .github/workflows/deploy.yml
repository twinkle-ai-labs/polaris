# 약관을 굽고 GitHub Pages로 올린다.

name: deploy

on:
  push:
    branches: [main]
  # 시행일이 오면 스스로 현행이 되어야 한다 — 그런데 정적 사이트는 아무도 굽지 않으면
  # 어제의 판본을 계속 내보낸다. 그래서 한국 시각 0시 5분에 매일 한 번 다시 굽는다.
  # (GitHub의 cron 은 UTC다. 15:05 UTC = 00:05 KST)
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 것은 마지막 것만 살린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 액션은 Node 24 판이다 (2026-09-17). ↩ checkout@v4 · setup-node@v4 · configure-pages@v5 ·
    # upload-pages-artifact@v3(안의 upload-artifact@v4) · deploy-pages@v4 가 Node 20 판이라 러너가
    # 매번 «Node 20 은 걷힌다, 24 로 강제로 돌린다» 경고를 달았다. 걷히는 날에는 경고가 아니라 실패다.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4 부터 점으로 시작하는 파일을 빼고 올린다. 빌드가 `out/.nojekyll` 을 굽고 있으므로
          # 지금까지와 같은 묶음이 나가도록 켠다 — 액션을 올린 것이 사이트를 바꾸지 않게
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
